<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · NIDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
<style>
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--bg-panel);
    border: 1px solid var(--border-hairline);
    border-radius: 14px;
    padding: 2rem 1.9rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; margin-bottom: 1.6rem; }
  .login-brand .mark {
    width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent-signal), #0a8f80);
    color: #04120f; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  }
  .login-brand h1 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
  .login-brand p { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); margin: 0; text-transform: uppercase; letter-spacing: 0.06em; }
  .login-card label { font-family: var(--font-mono); font-size: 0.76rem; color: var(--text-muted); margin-bottom: 0.3rem; display: block; }
  .login-card .form-control {
    background: var(--bg-input); border: 1px solid var(--border-hairline-strong); color: var(--text-primary);
    border-radius: var(--radius-sm); padding: 0.55rem 0.75rem; font-size: 0.9rem;
  }
  .login-card .form-control:focus {
    background: var(--bg-input); color: var(--text-primary); border-color: var(--accent-signal);
    box-shadow: 0 0 0 3px var(--accent-signal-dim);
  }
  .field-group { margin-bottom: 1rem; }
  .field-hint { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-faint); margin-top: 0.3rem; }
  .login-error {
    background: var(--sev-critical-dim); border: 1px solid rgba(255,59,92,0.4); color: #ffb3c0;
    font-size: 0.82rem; padding: 0.6rem 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1rem;
  }
  .login-btn-row { display: flex; gap: 0.6rem; margin-top: 0.4rem; }
  .login-btn-row .btn { flex: 1; text-align: center; }
  .login-foot { text-align: center; margin-top: 1.3rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-faint); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">NX</div>
      <h1>Create account</h1>
      <p>NIDS Console</p>
    </div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('signup_submit') }}">
      <div class="field-group">
        <label for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" autocomplete="username"
               value="{{ prefill_username }}" required autofocus minlength="3" maxlength="32">
        <div class="field-hint">3-32 characters: letters, numbers, dots, dashes, underscores</div>
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
        <div class="field-hint">At least 6 characters</div>
      </div>
      <div class="field-group">
        <label for="confirm_password">Confirm password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="6">
      </div>
      <div class="login-btn-row">
        <a href="{{ url_for('login_page') }}" class="btn btn-ghost">Back to sign in</a>
        <button type="submit" class="btn btn-signal">Create account</button>
      </div>
    </form>

    <div class="login-foot">You'll be signed in automatically once your account is created</div>
  </div>
</div>
</body>
</html>
